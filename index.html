const $=id=>document.getElementById(id);
const cam=$('cam'),stage=$('stage'),dbg=$('dbg');
if(location.search.includes('debug'))document.body.classList.add('debug');

const els={};
for(const k in IMG){const i=new Image();i.src=IMG[k];stage.appendChild(i);els[k]=i}
els.main.classList.add('on');

let cur='main',cand='main',n=0,since=0,M;
function setState(s){
  if(s===cand)n++;else{cand=s;n=1}
  if(cand!==cur&&n>=C.hold&&performance.now()-since>C.minMs){
    els[cur].classList.remove('on');cur=cand;els[cur].classList.add('on');since=performance.now();
  }
}

const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ext=(l,tip,pip)=>d(l[tip],l[0])>d(l[pip],l[0])*1.15;

function classify(f,h){
  const L=f.faceLandmarks&&f.faceLandmarks[0];
  const b={};((f.faceBlendshapes&&f.faceBlendshapes[0]&&f.faceBlendshapes[0].categories)||[]).forEach(c=>b[c.categoryName]=c.score);
  const info=(h.landmarks||[]).map(l=>({l,idx:ext(l,8,6),mid:ext(l,12,10),ring:ext(l,16,14),pin:ext(l,20,18),c:l[9]}));
  const sL=b.mouthSmileLeft||0,sR=b.mouthSmileRight||0,sm=(sL+sR)/2,jaw=b.jawOpen||0,
        br=((b.browDownLeft||0)+(b.browDownRight||0))/2,pk=b.mouthPucker||0;
  dbg.textContent=`${cur} | jaw ${jaw.toFixed(2)} smile ${sm.toFixed(2)} (${sL.toFixed(2)}/${sR.toFixed(2)}) brow ${br.toFixed(2)} pucker ${pk.toFixed(2)} hands ${info.length}`;
  if(L){
    const fw=d(L[234],L[454]),mouth={x:(L[13].x+L[14].x)/2,y:(L[13].y+L[14].y)/2},nose=L[1];
    if(info.length==2&&d(info[0].c,info[1].c)<fw*C.clasp&&d(info[0].c,mouth)<fw*1.3)return'pray';
    if(info.length==2&&info.every(i=>i.c.y<nose.y&&Math.abs(i.c.x-nose.x)>fw*.55))return'shock';
    for(const i of info)if(i.idx&&!i.mid&&!i.ring&&!i.pin&&d(i.l[8],mouth)<fw*C.nearMouth)return'shh';
  }
  for(const i of info)if(i.mid&&!i.idx&&!i.ring&&!i.pin)return'laugh';
  if(L){
    if(jaw>C.shockJaw&&sm<.3)return'shock';
    if(jaw>C.laughJaw&&sm>.4)return'laugh';
    if(pk>C.pucker&&jaw<.3)return'kiss';
    if(br>C.brow)return'angry';
    if(Math.max(sL,sR)>C.smirkHi&&Math.min(sL,sR)<C.smirkLo)return'smirk';
    if(sm>C.smile)return'smile';
  }
  return'main';
}

let last=0;
function loop(){
  requestAnimationFrame(loop);
  const t=performance.now();
  if(t-last<50||cam.readyState<2)return;
  last=t;
  try{setState(classify(M.face.detectForVideo(cam,t),M.hand.detectForVideo(cam,t)))}catch(e){dbg.textContent=String(e)}
}

$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='جاري تشغيل الكاميرا والتحميل...';
  try{
    cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    await cam.play();
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const mk=async dl=>({
      face:await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:FACE,delegate:dl},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true}),
      hand:await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:HAND,delegate:dl},runningMode:'VIDEO',numHands:2})});
    try{M=await mk('GPU')}catch(e){M=await mk('CPU')}
    try{await navigator.wakeLock.request('screen')}catch(e){}
    $('ov').hidden=true;loop();
  }catch(e){$('msg').textContent='صار خطأ: '+e.message;$('go').disabled=false}
};
</script>
</body>
</html>
