<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D Particle Hand Interaction System</title>
  <style>
    :root {
      --bg-color: rgba(20, 20, 20, 0.75);
      --text-color: #ffffff;
      --accent-color: #00ffcc;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: absolute;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }

    #webcam {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 135px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--accent-color);
      transform: scaleX(-1);
      z-index: 10;
      background: #000;
    }

    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: var(--bg-color);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 300px;
      pointer-events: auto;
    }

    .ui-panel.hidden { display: none; }

    .ui-panel h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--accent-color);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .control-group { margin-bottom: 20px; }

    .control-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: #aaa;
    }

    select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 16px; /* 16px stops iOS from zooming on focus */
      outline: none;
      cursor: pointer;
    }

    option {
      background: #222;
      color: #fff;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }

    input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%;
    }

    .status-box {
      font-size: 13px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border-left: 4px solid #fff;
      margin-top: 10px;
      line-height: 1.5;
    }

    .status-box.active {
      border-left-color: var(--accent-color);
      color: var(--accent-color);
    }

    .top-right-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 11;
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--bg-color);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      margin-top: 10px;
      background: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.85);
      padding: 15px 30px;
      border-radius: 30px;
      border: 1px solid var(--accent-color);
      max-width: 80vw;
      text-align: center;
      transition: opacity 0.5s;
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      .ui-panel {
        top: 12px;
        left: 12px;
        width: 220px;
        padding: 14px;
        border-radius: 12px;
      }
      .ui-panel h2 {
        font-size: 15px;
        margin-bottom: 12px;
        padding-bottom: 8px;
      }
      .control-group { margin-bottom: 12px; }
      .status-box { font-size: 12px; padding: 8px; }
      #webcam {
        width: 112px;
        height: 84px;
        bottom: 12px;
        right: 12px;
      }
      .top-right-controls { top: 12px; right: 12px; }
      .btn { padding: 8px 12px; font-size: 13px; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="loading">Loading particle system and camera...</div>
  <div id="canvas-container"></div>

  <!-- playsinline + muted + autoplay are required for the camera preview to work on iOS/Android -->
  <video id="webcam" autoplay playsinline muted webkit-playsinline></video>

  <div class="ui-panel" id="ui-panel">
    <h2>Particle Control Center</h2>

    <div class="control-group">
      <label>3D Particle Shape</label>
      <select id="model-select">
        <option value="tree">Sparkling Christmas Tree</option>
        <option value="saturn">Mysterious Saturn</option>
        <option value="heart">Romantic Heart</option>
      </select>
    </div>

    <div class="control-group">
      <label>Particle Color</label>
      <div class="color-picker-wrapper">
        <input type="color" id="particle-color" value="#00ffcc" />
        <span id="color-hex">#00ffcc</span>
      </div>
    </div>

    <div class="status-box" id="gesture-status">
      Particles are running. Waiting for camera permission...
    </div>

    <button class="btn btn-primary" id="btn-camera" style="display:none;">Enable Camera</button>
  </div>

  <div class="top-right-controls">
    <button class="btn" id="btn-panel">Hide Panel</button>
    <button class="btn" id="btn-fullscreen">Fullscreen</button>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let particleGeometry, particleSystem;

    const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));

    // Fewer particles on phones so the page stays smooth.
    const PARTICLE_COUNT = IS_MOBILE ? 18000 : 35000;

    const targetPositions = {
      heart: new Float32Array(PARTICLE_COUNT * 3),
      saturn: new Float32Array(PARTICLE_COUNT * 3),
      tree: new Float32Array(PARTICLE_COUNT * 3)
    };

    let currentModel = "tree";
    let gestureScale = 1.0;
    let targetGestureScale = 1.0;
    let targetRotationX = 0;
    let targetRotationY = 0;

    // At scale = 1 the particle model fills roughly 80% of the screen.
    const BASE_MODEL_SCALE = 1.75;
    const MIN_GESTURE_SCALE = 0.1;
    const MAX_GESTURE_SCALE = 2.4;
    const PALM_SIZE_MIN = 0.11;
    const PALM_SIZE_MAX = 0.28;
    const PALM_SIZE_SCALE_ONE = 0.1547368421;

    function mapPalmSizeToScale(palmSize) {
      if (palmSize <= PALM_SIZE_SCALE_ONE) {
        return THREE.MathUtils.mapLinear(
          palmSize,
          PALM_SIZE_MIN,
          PALM_SIZE_SCALE_ONE,
          MIN_GESTURE_SCALE,
          1.0
        );
      }

      return THREE.MathUtils.mapLinear(
        palmSize,
        PALM_SIZE_SCALE_ONE,
        PALM_SIZE_MAX,
        1.0,
        MAX_GESTURE_SCALE
      );
    }

    function generateModelPositions() {
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;

        // Christmas tree
        if (i < PARTICLE_COUNT * 0.08) {
          const angle = Math.random() * Math.PI * 2;
          const starWave = Math.abs(Math.sin(angle * 5));
          const r = (1.8 + starWave * 3.0) * Math.sqrt(Math.random());
          targetPositions.tree[i3] = r * Math.cos(angle);
          targetPositions.tree[i3 + 1] = 20 + (Math.random() - 0.5) * 1.5;
          targetPositions.tree[i3 + 2] = r * Math.sin(angle) * 0.45;
        } else if (i < PARTICLE_COUNT * 0.92) {
          const h = Math.random() * 32 - 14;
          const layerNormalized = (h + 14) / 32;
          const layerProgress = (layerNormalized * 4) % 1.0;
          let baseRadius = (1.0 - layerNormalized) * 18;
          baseRadius *= Math.pow(layerProgress, 0.42);
          const angle = Math.random() * Math.PI * 2;
          const r = Math.max(0, baseRadius * Math.sqrt(Math.random()) + (Math.random() - 0.5) * 2.5);
          targetPositions.tree[i3] = Math.cos(angle) * r;
          targetPositions.tree[i3 + 1] = h;
          targetPositions.tree[i3 + 2] = Math.sin(angle) * r;
        } else {
          const h = Math.random() * 5 - 19;
          const r = Math.random() * 2.2;
          const angle = Math.random() * Math.PI * 2;
          targetPositions.tree[i3] = Math.cos(angle) * r;
          targetPositions.tree[i3 + 1] = h;
          targetPositions.tree[i3 + 2] = Math.sin(angle) * r;
        }

        // Saturn
        if (i < PARTICLE_COUNT * 0.42) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const latFlatten = 0.82 + Math.random() * 0.06;
          const r = 11.5 * Math.cbrt(Math.random());
          targetPositions.saturn[i3] = r * Math.sin(phi) * Math.cos(theta);
          targetPositions.saturn[i3 + 1] = r * Math.sin(phi) * Math.sin(theta) * latFlatten;
          targetPositions.saturn[i3 + 2] = r * Math.cos(phi);
        } else {
          const ringBand = Math.random();
          const bandBase =
            ringBand < 0.22 ? 14.5 :
            ringBand < 0.48 ? 18.5 :
            ringBand < 0.72 ? 23.5 :
            28.5;
          const rRing = bandBase + Math.random() * 3.5 + Math.sin(bandBase * 1.7 + i * 0.013) * 0.9;
          const thetaRing = Math.random() * Math.PI * 2;
          const ringRipple = Math.sin(thetaRing * 10 + rRing * 0.9) * 0.45 + Math.sin(thetaRing * 23) * 0.18;
          const ringThickness = (Math.random() - 0.5) * (0.45 + ringBand * 0.85);
          targetPositions.saturn[i3] = (rRing + ringRipple) * Math.cos(thetaRing);
          targetPositions.saturn[i3 + 1] = ringThickness;
          targetPositions.saturn[i3 + 2] = (rRing + ringRipple) * Math.sin(thetaRing);
        }

        // Heart
        const t = Math.PI * 2 * Math.random();
        const u = Math.PI * (Math.random() - 0.5);
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = 6 * Math.sin(u) * (1 - Math.abs(Math.sin(t)));
        targetPositions.heart[i3] = x * 1.35;
        targetPositions.heart[i3 + 1] = y * 1.35;
        targetPositions.heart[i3 + 2] = z * 1.35;
      }
    }

    function initThree() {
      const container = document.getElementById("canvas-container");

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050505, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      // On tall/narrow phone screens, pull the camera back so the model still fits.
      camera.position.set(0, 5, window.innerWidth < window.innerHeight ? 85 : 58);

      renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      generateModelPositions();

      particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(new Float32Array(targetPositions.tree), 3)
      );

      const material = new THREE.PointsMaterial({
        size: IS_MOBILE ? 0.45 : 0.34,
        color: new THREE.Color(document.getElementById("particle-color").value),
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      });

      particleSystem = new THREE.Points(particleGeometry, material);
      scene.add(particleSystem);

      window.addEventListener("resize", onWindowResize);
      window.addEventListener("orientationchange", () => setTimeout(onWindowResize, 300));
    }

    /* ------------------------------------------------------------------
     * Camera + hand tracking
     * Mobile fixes:
     *  - Uses getUserMedia directly (the MediaPipe Camera helper often fails on phones)
     *  - Requests the front camera with flexible (ideal) resolution
     *  - Falls back to a manual "Enable Camera" button, because iOS Safari
     *    sometimes needs a real tap before it will start the camera
     *  - Detects the common failure: page not served over HTTPS
     * ------------------------------------------------------------------ */
    let handsInstance = null;
    let cameraRunning = false;
    let processing = false;

    function setStatus(text, active) {
      const statusBox = document.getElementById("gesture-status");
      statusBox.textContent = text;
      statusBox.classList.toggle("active", !!active);
    }

    function hideLoading() {
      const loadingEl = document.getElementById("loading");
      if (loadingEl) {
        loadingEl.style.opacity = "0";
        setTimeout(() => loadingEl.remove(), 500);
      }
    }

    function showLoadingError(msg) {
      const loadingEl = document.getElementById("loading");
      if (loadingEl) {
        loadingEl.textContent = msg;
        setTimeout(hideLoading, 4000);
      }
    }

    function explainCameraError(err) {
      const name = err && err.name;
      if (!window.isSecureContext) {
        return "Camera needs a secure page. Open this page over https:// (or localhost). It will not work from http:// or a local file on a phone.";
      }
      if (name === "NotAllowedError" || name === "SecurityError") {
        return "Camera permission was denied. Allow camera access for this site in your browser settings, then tap Enable Camera.";
      }
      if (name === "NotFoundError" || name === "OverconstrainedError") {
        return "No suitable camera was found on this device.";
      }
      if (name === "NotReadableError") {
        return "The camera is being used by another app. Close it and tap Enable Camera.";
      }
      return "Camera failed to start: " + (err && err.message ? err.message : "unknown error") + ". Tap Enable Camera to retry.";
    }

    async function startCamera() {
      const videoElement = document.getElementById("webcam");
      const cameraBtn = document.getElementById("btn-camera");

      if (cameraRunning) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const msg = window.isSecureContext
          ? "This browser does not support camera access."
          : "Camera needs a secure page. Open this page over https:// (or localhost).";
        setStatus(msg + " You can still drag to rotate the particles.", false);
        showLoadingError(msg);
        cameraBtn.style.display = "none";
        return;
      }

      try {
        setStatus("Starting camera...", false);

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          });
        } catch (firstErr) {
          // Some devices reject the constraints; retry with the simplest request.
          if (firstErr && (firstErr.name === "OverconstrainedError" || firstErr.name === "NotFoundError")) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
          } else {
            throw firstErr;
          }
        }

        videoElement.setAttribute("playsinline", "");
        videoElement.muted = true;
        videoElement.srcObject = stream;
        await videoElement.play();

        cameraRunning = true;
        cameraBtn.style.display = "none";
        setStatus("Camera started. Show your hand to the camera.", false);

        if (handsInstance) {
          requestAnimationFrame(processFrame);
        }
      } catch (err) {
        console.error(err);
        const msg = explainCameraError(err);
        setStatus(msg, false);
        showLoadingError(msg);
        cameraBtn.style.display = "block";
      }
    }

    async function processFrame() {
      if (!cameraRunning) return;

      const videoElement = document.getElementById("webcam");

      if (!processing && handsInstance && videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
        processing = true;
        try {
          await handsInstance.send({ image: videoElement });
        } catch (e) {
          console.error(e);
        }
        processing = false;
      }

      requestAnimationFrame(processFrame);
    }

    function onHandResults(results) {
      hideLoading();

      const statusBox = document.getElementById("gesture-status");

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusBox.classList.add("active");

        const hand1 = results.multiHandLandmarks[0];
        const wrist = hand1[0];
        const thumbTip = hand1[4];
        const thumbIP = hand1[3];
        const indexPip = hand1[6];
        const indexTip = hand1[8];
        const middlePip = hand1[10];
        const middleTip = hand1[12];
        const ringPip = hand1[14];
        const middleBase = hand1[9];
        const ringTip = hand1[16];
        const pinkyPip = hand1[18];
        const pinkyTip = hand1[20];

        const palmSize = Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y) || 0.08;
        const palmCenterX = (wrist.x + middleBase.x) * 0.5;
        const palmCenterY = (wrist.y + middleBase.y) * 0.5;

        const fingertipSpread =
          (
            Math.hypot(thumbTip.x - palmCenterX, thumbTip.y - palmCenterY) +
            Math.hypot(indexTip.x - palmCenterX, indexTip.y - palmCenterY) +
            Math.hypot(middleTip.x - palmCenterX, middleTip.y - palmCenterY) +
            Math.hypot(ringTip.x - palmCenterX, ringTip.y - palmCenterY) +
            Math.hypot(pinkyTip.x - palmCenterX, pinkyTip.y - palmCenterY)
          ) / 5;

        const openness = fingertipSpread / palmSize;

        const thumbCurled =
          Math.hypot(thumbTip.x - palmCenterX, thumbTip.y - palmCenterY) <
          Math.hypot(thumbIP.x - palmCenterX, thumbIP.y - palmCenterY) * 1.1;
        const indexCurled = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) < Math.hypot(indexPip.x - wrist.x, indexPip.y - wrist.y) * 1.08;
        const middleCurled = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) < Math.hypot(middlePip.x - wrist.x, middlePip.y - wrist.y) * 1.08;
        const ringCurled = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) < Math.hypot(ringPip.x - wrist.x, ringPip.y - wrist.y) * 1.08;
        const pinkyCurled = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y) < Math.hypot(pinkyPip.x - wrist.x, pinkyPip.y - wrist.y) * 1.12;
        const curledCount = [indexCurled, middleCurled, ringCurled, pinkyCurled].filter(Boolean).length;
        const isFist = openness < 1.72 && thumbCurled && curledCount >= 3;

        const handCenterX = (wrist.x + middleBase.x + hand1[5].x + hand1[17].x) * 0.25;
        const handCenterY = (wrist.y + middleBase.y + hand1[5].y + hand1[17].y) * 0.25;
        targetRotationY = -(handCenterX - 0.5) * Math.PI * 1.8;
        targetRotationX = (handCenterY - 0.5) * Math.PI * 1.1;

        if (isFist) {
          const distanceScale = mapPalmSizeToScale(palmSize);
          targetGestureScale = THREE.MathUtils.clamp(distanceScale, MIN_GESTURE_SCALE, MAX_GESTURE_SCALE);
        } else {
          targetGestureScale = 1.0;
        }

        statusBox.innerHTML =
          `Gesture: ${isFist ? "Fist" : "Not a fist"} &nbsp; Scale: ${targetGestureScale.toFixed(2)}<br>` +
          `${isFist ? "The closer your fist, the bigger the particles" : "Only rotation is active right now"}`;
      } else {
        statusBox.classList.remove("active");
        statusBox.textContent = "No hand detected. Place your hand in the camera preview at the bottom right.";
        targetGestureScale = 1.0;
      }
    }

    async function initWebcamAndAI() {
      const cameraBtn = document.getElementById("btn-camera");
      cameraBtn.addEventListener("click", startCamera);

      if (!window.Hands) {
        showLoadingError("Hand tracking library failed to load. Check your connection and refresh. Particles still work.");
        setStatus("Hand tracking library failed to load, but the particle system is running.", false);
        // Still start the preview so the camera at least works.
        startCamera();
        return;
      }

      handsInstance = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
      });

      handsInstance.setOptions({
        maxNumHands: 1,
        // Lighter model on phones for better frame rate.
        modelComplexity: IS_MOBILE ? 0 : 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      handsInstance.onResults(onHandResults);

      // Start the camera first (permission prompt), then warm up the model.
      await startCamera();

      try {
        await handsInstance.initialize();
      } catch (e) {
        console.error(e);
        showLoadingError("Failed to load the hand tracking model. Check your connection and refresh.");
        setStatus("Hand tracking model failed to load. Particles still work with touch/mouse.", false);
        return;
      }

      if (cameraRunning) {
        requestAnimationFrame(processFrame);
      }
      // If the camera did not start yet, startCamera() (via the button) will begin the loop.
      setTimeout(hideLoading, 1500);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!particleSystem || !particleGeometry) return;

      gestureScale += (targetGestureScale - gestureScale) * 0.12;

      const actualScale = BASE_MODEL_SCALE * gestureScale;

      particleSystem.rotation.y += (targetRotationY - particleSystem.rotation.y) * 0.05;
      particleSystem.rotation.x += (targetRotationX - particleSystem.rotation.x) * 0.05;

      const positions = particleGeometry.attributes.position.array;
      const targetArray = targetPositions[currentModel];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        positions[i3] += (targetArray[i3] * actualScale - positions[i3]) * 0.08;
        positions[i3 + 1] += (targetArray[i3 + 1] * actualScale - positions[i3 + 1]) * 0.08;
        positions[i3 + 2] += (targetArray[i3 + 2] * actualScale - positions[i3 + 2]) * 0.08;
      }

      particleGeometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function setupUI() {
      const modelSelect = document.getElementById("model-select");
      const colorInput = document.getElementById("particle-color");
      const colorHex = document.getElementById("color-hex");
      const panel = document.getElementById("ui-panel");
      const panelBtn = document.getElementById("btn-panel");
      const fsBtn = document.getElementById("btn-fullscreen");

      modelSelect.addEventListener("change", (e) => {
        currentModel = e.target.value;
      });

      colorInput.addEventListener("input", (e) => {
        const color = e.target.value;
        colorHex.textContent = color;
        document.documentElement.style.setProperty("--accent-color", color);
        if (particleSystem) particleSystem.material.color.set(color);
      });

      panelBtn.addEventListener("click", () => {
        const hidden = panel.classList.toggle("hidden");
        panelBtn.textContent = hidden ? "Show Panel" : "Hide Panel";
      });

      // Start with the panel collapsed on small screens so the model is visible.
      if (window.innerWidth <= 600) {
        panel.classList.add("hidden");
        panelBtn.textContent = "Show Panel";
      }

      // iPhone Safari does not support fullscreen on normal pages, so hide the button there.
      const canFullscreen = document.documentElement.requestFullscreen ||
                            document.documentElement.webkitRequestFullscreen;
      if (!canFullscreen) {
        fsBtn.style.display = "none";
      }

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (document.documentElement.requestFullscreen ||
           document.documentElement.webkitRequestFullscreen).call(document.documentElement);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      initThree();
      setupUI();
      animate();
      initWebcamAndAI();
    });
  </script>
</body>
</html>
